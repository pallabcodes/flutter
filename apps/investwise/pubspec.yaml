name: investwise
description: AI-Powered Micro-Investing Platform

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared packages (from monorepo)
  finwise_core:
    path: ../../packages/core

  # App-specific dependencies
  http: ^1.1.0
  crypto: ^3.0.3
  share_plus: ^7.0.0
  url_launcher: ^6.1.0
  flutter_secure_storage: ^8.0.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
