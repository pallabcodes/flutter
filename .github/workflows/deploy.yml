name: FinWise Deployment

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-android:
    name: Deploy Android
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons

      - name: Set up Keystore
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android/app/keystore.jks
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "storePassword=$ANDROID_STORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android Bundle
        run: flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.finwise.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.environment == 'production' && 'production' || 'beta' }}
          inAppUpdatePriority: 3
          userFraction: 0.5
          whatsNewDirectory: distribution/whatsnew

  deploy-ios:
    name: Deploy iOS
    runs-on: macos-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Set up code signing
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificates
          echo "$IOS_DISTRIBUTION_CERTIFICATE" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # Import provisioning profile
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}

      - name: Build iOS
        run: flutter build ipa --release --export-options-plist=ios/exportOptions.plist

      - name: Upload to TestFlight/App Store
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/finwise.ipa \
            --username "$APP_STORE_USERNAME" \
            --password "$APP_STORE_PASSWORD"
        env:
          APP_STORE_USERNAME: ${{ secrets.APP_STORE_USERNAME }}
          APP_STORE_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons

      - name: Build Web
        run: flutter build web --release

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync build/web s3://$WEB_BUCKET_NAME --delete --cache-control max-age=31536000,public
        env:
          WEB_BUCKET_NAME: ${{ secrets.WEB_BUCKET_NAME }}

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios, deploy-web]
    if: always()

    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 FinWise Deployment ${{ job.status == 'success' && 'Successful' || 'Failed' }}

            Environment: ${{ github.event.inputs.environment || 'staging' }}
            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            📱 Android: ${{ needs.deploy-android.result == 'success' && '✅ Deployed' || '❌ Failed' }}
            🍎 iOS: ${{ needs.deploy-ios.result == 'success' && '✅ Deployed' || '❌ Failed' }}
            🌐 Web: ${{ needs.deploy-web.result == 'success' && '✅ Deployed' || '❌ Failed' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
