app:
  name: FinWise
  version: 1.0.0-dev
  environment: development
  debug: true

api:
  base_url: https://api-dev.finwise.com
  timeout: 30000
  retry_attempts: 3

features:
  ai_recommendations: true
  premium_features: true
  social_features: false
  offline_mode: true

analytics:
  enabled: false
  tracking_id: DEV_TRACKING_ID

security:
  certificate_pinning: false
  encryption_enabled: true

firebase:
  project_id: finwise-dev
  api_key: dev_api_key_here

stripe:
  publishable_key: pk_test_dev_key_here
  secret_key: sk_test_dev_key_here

monitoring:
  crash_reporting: false
  performance_monitoring: false
  error_tracking: true
