plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.finwise.app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.finwise.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Multi-density support
        vectorDrawables {
            useSupportLibrary true
        }

        // Enable multidex for larger apps
        multiDexEnabled true

        // Signing config
        signingConfig signingConfigs.debug

        // Build config fields for different environments
        buildConfigField "String", "API_BASE_URL", "\"https://api.finwise.app\""
        buildConfigField "String", "WS_BASE_URL", "\"wss://ws.finwise.app\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-prod\""
        buildConfigField "boolean", "ENABLE_ANALYTICS", "true"
        buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "true"
        buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
        buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "API_BASE_URL", "\"https://api-dev.finwise.app\""
            buildConfigField "String", "WS_BASE_URL", "\"wss://ws-dev.finwise.app\""
            buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-dev\""
            buildConfigField "boolean", "ENABLE_ANALYTICS", "false"
            buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "false"
            buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
            buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Code shrinking and optimization
            shrinkResources true

            // APK splitting for different ABIs
            splits {
                abi {
                    enable true
                    reset()
                    include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                    universalApk false
                }
            }
        }

        staging {
            initWith release
            matchingFallbacks = ['release', 'debug']
            buildConfigField "String", "API_BASE_URL", "\"https://api-staging.finwise.app\""
            buildConfigField "String", "WS_BASE_URL", "\"wss://ws-staging.finwise.app\""
            buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-staging\""
            buildConfigField "boolean", "ENABLE_ANALYTICS", "true"
            buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "true"
            buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
            buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
        }
    }

    flavorDimensions "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "API_BASE_URL", "\"https://api-dev.finwise.app\""
            buildConfigField "String", "WS_BASE_URL", "\"wss://ws-dev.finwise.app\""
            buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-dev\""
            buildConfigField "boolean", "ENABLE_ANALYTICS", "false"
            buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "false"
            buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
            buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
        }

        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "API_BASE_URL", "\"https://api-staging.finwise.app\""
            buildConfigField "String", "WS_BASE_URL", "\"wss://ws-staging.finwise.app\""
            buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-staging\""
            buildConfigField "boolean", "ENABLE_ANALYTICS", "true"
            buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "true"
            buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
            buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
        }

        production {
            dimension "environment"
            buildConfigField "String", "API_BASE_URL", "\"https://api.finwise.app\""
            buildConfigField "String", "WS_BASE_URL", "\"wss://ws.finwise.app\""
            buildConfigField "String", "FIREBASE_PROJECT_ID", "\"finwise-prod\""
            buildConfigField "boolean", "ENABLE_ANALYTICS", "true"
            buildConfigField "boolean", "ENABLE_CRASH_REPORTING", "true"
            buildConfigField "boolean", "ENABLE_OFFLINE_MODE", "true"
            buildConfigField "boolean", "ENABLE_RECEIPT_SCANNING", "true"
        }
    }

    // Variant filter to only build certain combinations
    variantFilter { variant ->
        def names = variant.flavors*.name
        // Only allow development-debug, staging-release, production-release
        if (names.contains("development") && variant.buildType.name != "debug") {
            variant.ignore = true
        }
        if (names.contains("staging") && variant.buildType.name != "release") {
            variant.ignore = true
        }
        if (names.contains("production") && variant.buildType.name != "release") {
            variant.ignore = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.android.support:multidex:1.0.3'

    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Google ML Kit for receipt scanning
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    // Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'

    // Secure storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Work manager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Image processing
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // PDF generation
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'
}
